name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches pyproject version
        run: |
          project_version="$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')"
          if [ "$project_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag v$project_version expected but got tag ${GITHUB_REF_NAME}. Update pyproject.toml version or the tag."
            exit 1
          fi
          echo "Version $project_version matches tag."

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          version="${{ steps.version.outputs.version }}"
          # Pull the section for this version out of CHANGELOG.md (between its
          # heading and the next ## heading). Fall back to auto-generated notes.
          notes="$(awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { grab=1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md)"
          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
            {
              echo "notes<<EOF"
              echo "$notes"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create release (with CHANGELOG notes)
        if: steps.notes.outputs.has_notes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "${{ steps.notes.outputs.notes }}"

      - name: Create release (auto-generated notes)
        if: steps.notes.outputs.has_notes == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
